name: Validate committed metrics

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python analysis/build_metrics.py
      - run: python analysis/check_numbers.py
      - run: git diff --exit-code -- outputs docs/data.js
